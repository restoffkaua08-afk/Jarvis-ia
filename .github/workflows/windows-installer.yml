name: Windows installer validation

on:
  push:
    branches: [main]
    paths:
      - "deploy/windows/**"
      - "src/openjarvis/cli/code_*.py"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "deploy/windows/**"
      - "src/openjarvis/cli/code_*.py"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

  cli-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        shell: pwsh
        run: |
          python -m pip install uv
          uv --version

      - name: Exercise isolated CLI installation
        shell: pwsh
        env:
          OPENJARVIS_HOME: ${{ runner.temp }}\JarvisInstall
          OPENJARVIS_REPO_URL: ${{ github.workspace }}
          OPENJARVIS_SKIP_SERVICE: "1"
          OPENJARVIS_SKIP_OLLAMA: "1"
          OPENJARVIS_CLI_ONLY: "1"
        run: |
          .\deploy\windows\install.ps1 `
            -SkipService `
            -SkipOllama `
            -CliOnly
          & "$env:OPENJARVIS_HOME\bin\jarvis.cmd" --help
          & "$env:OPENJARVIS_HOME\bin\jarvis.cmd" code --benchmark-prepare
